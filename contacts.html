<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Contacts - SheSafe</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <main class="app-container">
        <div class="page-header justify-between">
            <h1 class="page-title flex items-center gap-2"><i data-lucide="users"></i> Emergency Contacts</h1>
            <button class="icon-btn" onclick="window.location.href='home.html'"><i data-lucide="x" style="width:20px;height:20px;"></i></button>
        </div>

        <div class="p-6">
            <p class="text-sm text-muted mb-6">
                These contacts will receive immediate SMS alerts with your live location when SOS is triggered.
            </p>

            <div id="contactsList">
                <div class="text-center text-muted text-sm my-6">Loading contacts...</div>
            </div>

            <button class="btn btn-outline mt-4 flex items-center justify-center gap-2" style="color: var(--primary); border-color: var(--primary);" onclick="openAddModal()">
                <i data-lucide="user-plus" style="width: 18px; height: 18px;"></i> Add New Contact
            </button>
        </div>
    </main>

    <!-- Modal for Adding New Contact -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <h3 class="mb-4">Add Emergency Contact</h3>
            <div class="input-group mb-2">
                <input type="text" id="newContactName" class="input-control" placeholder="Full Name (e.g. Mom, Sarah)" required>
            </div>
            <div class="input-group mb-2">
                <input type="tel" id="newContactPhone" class="input-control" placeholder="Phone Number (+91 ...)" required>
            </div>
            <div class="input-group mb-2">
                <select id="newContactRelation" class="input-control">
                    <option value="Mother">Mother</option>
                    <option value="Father">Father</option>
                    <option value="Sister">Sister</option>
                    <option value="Brother">Brother</option>
                    <option value="Friend">Friend</option>
                    <option value="Guardian">Guardian</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="input-group mb-4">
                <input type="email" id="newContactEmail" class="input-control" placeholder="Email Address (Optional)">
            </div>
            
            <label class="flex items-center gap-2 mb-6 text-sm">
                <input type="checkbox" id="newContactPrimary"> 
                <span class="text-muted">Set as primary emergency contact</span>
            </label>

            <div class="flex gap-4">
                <button class="btn btn-outline flex-1" onclick="closeAddModal()">Cancel</button>
                <button class="btn btn-primary flex-1" id="saveContactBtn" onclick="saveNewContact()">Save</button>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => { loadContacts(); });

        async function loadContacts() {
            const listDiv = document.getElementById("contactsList");
            try {
                const data = await contactsAPI.getAll();
                if (data.success && data.contacts) { renderContacts(data.contacts); }
                else { listDiv.innerHTML = '<p class="text-muted text-sm text-center my-6">No emergency contacts added yet.</p>'; }
            } catch (err) {
                listDiv.innerHTML = `<p class="text-danger text-sm text-center my-6">Error loading contacts: ${err.message}</p>`;
            }
        }

        function renderContacts(contacts) {
            const listDiv = document.getElementById("contactsList");
            if (contacts.length === 0) {
                listDiv.innerHTML = '<p class="text-muted text-sm text-center my-6">No contacts added yet. Tap "Add New Contact" below.</p>';
                return;
            }

            const relationIcons = { 'mother':'heart', 'father':'heart', 'sister':'users', 'brother':'users', 'friend':'user-check', 'guardian':'shield' };

            listDiv.innerHTML = contacts.map(c => {
                const icon = relationIcons[(c.relationship || '').toLowerCase()] || 'user';
                const isPrimaryClass = c.is_primary ? 'primary' : '';
                const primaryBadge = c.is_primary ? '<span class="badge-primary">Primary</span>' : '';

                return `
                    <div class="list-item ${isPrimaryClass}">
                        <div class="list-item-content">
                            <h3 class="flex items-center gap-2"><i data-lucide="${icon}" style="width: 16px; height: 16px;"></i> ${escapeHtml(c.name)} ${primaryBadge}</h3>
                            <p>${escapeHtml(c.phone)} (${escapeHtml(c.relationship)})</p>
                        </div>
                        <button class="icon-btn" onclick="deleteContactItem(${c.id}, '${escapeHtml(c.name)}')" title="Delete contact"><i data-lucide="trash-2" style="width: 16px; height: 16px; color: var(--danger);"></i></button>
                    </div>
                `;
            }).join('');
            setTimeout(() => { lucide.createIcons(); }, 0);
        }

        function openAddModal() {
            document.getElementById("addModal").style.display = "flex";
            document.getElementById("newContactName").focus();
        }

        function closeAddModal() {
            document.getElementById("addModal").style.display = "none";
            document.getElementById("newContactName").value = "";
            document.getElementById("newContactPhone").value = "";
            document.getElementById("newContactEmail").value = "";
            document.getElementById("newContactPrimary").checked = false;
        }

        async function saveNewContact() {
            const name = document.getElementById("newContactName").value.trim();
            const phone = document.getElementById("newContactPhone").value.trim();
            const relation = document.getElementById("newContactRelation").value;
            const email = document.getElementById("newContactEmail").value.trim();
            const isPrimary = document.getElementById("newContactPrimary").checked;
            const saveBtn = document.getElementById("saveContactBtn");

            if (!name || !phone) { showToast("Please enter contact name and phone number.", "warning"); return; }

            try {
                saveBtn.disabled = true; saveBtn.innerText = "Saving...";
                await contactsAPI.add(name, phone, relation, email);
                showToast(`Contact "${name}" added!`, "success");
                closeAddModal(); loadContacts();
            } catch (err) { showToast(err.message || "Failed to add contact", "error"); }
            finally { saveBtn.disabled = false; saveBtn.innerText = "Save"; }
        }

        async function deleteContactItem(id, name) {
            if (!confirm(`Are you sure you want to remove "${name}" from emergency contacts?`)) return;
            try {
                await contactsAPI.delete(id);
                showToast(`Removed "${name}"`, "info");
                loadContacts();
            } catch (err) { showToast("Failed to delete contact: " + err.message, "error"); }
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }
    </script>
    <script>lucide.createIcons();</script>
</body>
</html>
