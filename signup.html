<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SheSafe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="signup-container">
    <div class="logo" style="text-align: center; margin-bottom: 10px;">🛡️</div>
    <h1>Create Account</h1>
    <p>Join SheSafe and stay protected.</p>

    <!-- Server Status Indicator -->
    <div style="text-align: center;">
        <span id="serverStatusPill" class="server-status-pill">
            <span id="statusDot">🟢</span> <span id="statusText">Checking Backend Server...</span>
        </span>
    </div>

    <form id="signupForm" onsubmit="handleSignup(event)">
        <input type="text" id="fullName" placeholder="Full Name" required>
        <input type="tel" id="phone" placeholder="Phone Number" required>
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="password" id="password" placeholder="Password (min 6 chars)" required>
        <input type="password" id="confirmPassword" placeholder="Confirm Password" required>

        <button type="submit" id="signupBtn">Sign Up</button>
    </form>

    <h3>──────── OR ────────</h3>

    <button class="google" type="button" onclick="window.location.href='login.html'">
        ⚡ Go to Demo / Login Page
    </button>

    <p style="margin-top: 25px;">
        Already have an account?
        <a href="login.html">Log In</a>
    </p>
</div>

<script src="api.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
    checkServer();
});

async function checkServer() {
    const pill = document.getElementById('serverStatusPill');
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('statusText');

    try {
        const health = await authAPI.checkServerHealth();
        if (health.online) {
            pill.className = 'server-status-pill';
            dot.innerText = '🟢';
            txt.innerText = 'Backend Online (Port 5000)';
        } else {
            pill.className = 'server-status-pill offline';
            dot.innerText = '⚠️';
            txt.innerText = 'Server Offline (Demo Mode Available)';
        }
    } catch {
        pill.className = 'server-status-pill offline';
        dot.innerText = '⚠️';
        txt.innerText = 'Server Offline (Demo Mode Available)';
    }
}

async function handleSignup(e) {
    e.preventDefault();
    const fullName = document.getElementById('fullName').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const btn = document.getElementById('signupBtn');

    if (!fullName || !phone || !email || !password) {
        showToast('Please fill in all fields.', 'warning');
        return;
    }

    if (password !== confirmPassword) {
        showToast('Passwords do not match.', 'error');
        return;
    }

    if (password.length < 6) {
        showToast('Password must be at least 6 characters.', 'warning');
        return;
    }

    try {
        btn.disabled = true;
        btn.innerText = 'Creating account...';

        const data = await authAPI.signup(fullName, phone, email, password, confirmPassword);
        const name = data.user?.name || fullName;
        
        if (data.offline) {
            showToast(`Account created locally! Welcome, ${name}`, 'info');
        } else {
            showToast(`Account created successfully! Welcome, ${name}`, 'success');
        }

        setTimeout(() => {
            window.location.href = 'home.html';
        }, 1000);
    } catch (err) {
        showToast(err.message || 'Signup failed. Please try again.', 'error');
    } finally {
        btn.disabled = false;
        btn.innerText = 'Sign Up';
    }
}
</script>

</body>
</html>
