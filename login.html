<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SheSafe</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body class="auth-page">

    <main class="auth-container">

        <!-- Logo -->
        <div class="brand">
            <div class="brand-logo">🛡️</div>
            <h1>SheSafe</h1>
            <p>Your Safety, Our Priority</p>
        </div>

        <!-- Login Card -->
        <section class="auth-card">

            <h2>Welcome Back 👋</h2>
            <p class="auth-subtitle">
                Sign in to stay protected and connected.
            </p>

            <!-- Backend status -->
            <div id="serverStatusPill" class="server-status-pill">
                <span id="statusDot">🟢</span>
                <span id="statusText">Checking connection...</span>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">

                <label for="loginEmail">Email or phone</label>
                <input
                    type="text"
                    id="loginEmail"
                    placeholder="Enter your email or phone"
                    required
                >

                <label for="loginPassword">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        
                        required
                    >
                    <button
                        type="button"
                        class="password-toggle"
                        onclick="togglePassword()"
                    >
                        👁
                    </button>
                </div>

                <div class="login-options">
                    <label class="remember">
                        <input type="checkbox">
                        <span>Remember me</span>
                    </label>

                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit" id="loginBtn" class="primary-btn">
                    Log In
                </button>

            </form>

            <div class="divider">
                <span>or</span>
            </div>

            <button
                type="button"
                id="quickDemoBtn"
                class="demo-btn"
                onclick="quickDemoLogin()"
            >
                ⚡ Try Demo Login
            </button>

            <p class="signup-text">
                Don't have an account?
                <a href="signup.html">Create an account</a>
            </p>

        </section>

        <p class="privacy-note">
            🔒 Your information is protected and kept private.
        </p>

    </main>

    <script src="./api.js"></script>

    <script>

        /* Already logged in */
        if (TokenStorage.getToken()) {
            window.location.href = 'home.html';
        }

        /* Backend status */
        document.addEventListener('DOMContentLoaded', () => {
            checkServer();
        });

        async function checkServer() {

            const pill = document.getElementById('serverStatusPill');
            const dot = document.getElementById('statusDot');
            const txt = document.getElementById('statusText');

            try {

                const health = await authAPI.checkServerHealth();

                if (health.online) {

                    pill.className = 'server-status-pill online';
                    dot.innerText = '🟢';
                    txt.innerText = 'Secure connection';

                } else {

                    pill.className = 'server-status-pill offline';
                    dot.innerText = '⚠️';
                    txt.innerText = 'Demo mode available';

                }

            } catch {

                pill.className = 'server-status-pill offline';
                dot.innerText = '⚠️';
                txt.innerText = 'Demo mode available';

            }
        }

        /* Login */
        async function handleLogin(e) {

            e.preventDefault();

            const emailOrPhone =
                document.getElementById('loginEmail').value.trim();

            const password =
                document.getElementById('loginPassword').value;

            const btn =
                document.getElementById('loginBtn');

            if (!emailOrPhone || !password) {
                showToast(
                    'Please enter your email and password.',
                    'warning'
                );
                return;
            }

            try {

                btn.disabled = true;
                btn.innerText = 'Signing in...';

                const data =
                    await authAPI.login(emailOrPhone, password);

                const name =
                    data.user?.name || 'User';

                if (data.offline) {

                    showToast(
                        `Welcome, ${name}! Demo mode.`,
                        'info'
                    );

                } else {

                    showToast(
                        `Welcome back, ${name}!`,
                        'success'
                    );

                }

                setTimeout(() => {
                    window.location.href = 'home.html';
                }, 800);

            } catch (err) {

                showToast(
                    err.message ||
                    'Login failed. Please check your credentials.',
                    'error'
                );

            } finally {

                btn.disabled = false;
                btn.innerText = 'Log In';

            }
        }

        /* Demo login */
         async function quickDemoLogin() {
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    if (!email || !password) {
        showToast('Please enter your email and password.', 'warning');
        return;
    }

    const btn = document.getElementById('quickDemoBtn');

    try {
        btn.disabled = true;
        btn.innerText = 'Signing in...';

        const data = await authAPI.login(email, password);

        const name = data.user?.name || 'User';

        showToast(`Welcome, ${name}!`, 'success');

        setTimeout(() => {
            window.location.href = 'home.html';
        }, 600);

    } catch (err) {
        showToast(
            err.message || 'Login failed.',
            'error'
        );
    } finally {
        btn.disabled = false;
        btn.innerText = '⚡ Try Demo Login';
    }
}

        /* Show/hide password */
        function togglePassword() {

            const input =
                document.getElementById('loginPassword');

            input.type =
                input.type === 'password'
                    ? 'text'
                    : 'password';
        }

    </script>

</body>
</html>
