<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - SheSafe</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .setting-item {
            background: #f8f8f8;
            padding: 14px 18px;
            border-radius: 12px;
            margin: 12px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
        }
        .setting-label {
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }
        /* Toggle Switch */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }
        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #6A5AE0;
        }
        input:checked + .slider:before {
            transform: translateX(20px);
        }
    </style>
</head>

<body>

<div class="home-container">

    <h2>⚙️ Settings & Preferences</h2>
    <p style="font-size: 13px; color: #666; margin: 10px 0 20px 0;">Configure your safety app preferences</p>

    <div class="setting-item">
        <span class="setting-label">🔔 Push & SMS Notifications</span>
        <label class="switch">
            <input type="checkbox" id="toggleNotifications" onchange="updateSetting('notifications', this.checked)">
            <span class="slider"></span>
        </label>
    </div>

    <div class="setting-item">
        <span class="setting-label">🔊 Siren Sound on SOS</span>
        <label class="switch">
            <input type="checkbox" id="toggleSoundAlarm" onchange="updateSetting('soundAlarm', this.checked)">
            <span class="slider"></span>
        </label>
    </div>

    <div class="setting-item">
        <span class="setting-label">📍 Auto-Share Live GPS</span>
        <label class="switch">
            <input type="checkbox" id="toggleAutoLocation" onchange="updateSetting('autoShareLocation', this.checked)">
            <span class="slider"></span>
        </label>
    </div>

    <div class="card" style="text-align: left; padding: 14px 18px;">
        🌐 <strong>Language:</strong> English (US)
    </div>

    <div class="card" style="text-align: left; padding: 14px 18px;">
        ℹ️ <strong>Version:</strong> SheSafe Full-Stack v1.0.0
    </div>

    <br>

    <button class="back-btn" onclick="window.location.href='home.html'">
        ⬅ Back Home
    </button>

</div>

<script src="api.js"></script>
<script>
document.addEventListener("DOMContentLoaded", async () => {
    try {
        const data = await settingsAPI.get();
        if (data.success && data.settings) {
            document.getElementById("toggleNotifications").checked = data.settings.notifications;
            document.getElementById("toggleSoundAlarm").checked = data.settings.soundAlarm;
            document.getElementById("toggleAutoLocation").checked = data.settings.autoShareLocation;
        }
    } catch (e) {
        console.log("Using default settings state");
    }
});

async function updateSetting(key, val) {
    try {
        await settingsAPI.update({ [key]: val });
        showToast("Setting preference updated!", "success");
    } catch (e) {
        showToast("Failed to save setting: " + e.message, "error");
    }
}
</script>

</body>
</html>
