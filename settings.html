<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - SheSafe</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <main class="app-container">
        <div class="page-header justify-between">
            <h1 class="page-title flex items-center gap-2"><i data-lucide="settings"></i> Settings</h1>
            <button class="icon-btn" onclick="window.location.href='home.html'"><i data-lucide="x" style="width: 20px; height: 20px;"></i></button>
        </div>

        <div class="p-6">
            <p class="text-sm text-muted mb-6">Configure your safety app preferences</p>

            <div class="card p-4 mb-4">
                <div class="flex justify-between items-center mb-4 pb-4" style="border-bottom: 1px solid var(--border);">
                    <div>
                        <strong class="text-sm flex items-center gap-2"><i data-lucide="bell" style="width: 16px; height: 16px;"></i> Push & SMS Notifications</strong>
                        <p class="text-xs text-muted mt-1">Receive critical alerts</p>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="toggleNotifications" onchange="updateSetting('notifications', this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="flex justify-between items-center mb-4 pb-4" style="border-bottom: 1px solid var(--border);">
                    <div>
                        <strong class="text-sm flex items-center gap-2"><i data-lucide="volume-2" style="width: 16px; height: 16px;"></i> Siren Sound on SOS</strong>
                        <p class="text-xs text-muted mt-1">Play loud alarm on trigger</p>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="toggleSoundAlarm" onchange="updateSetting('soundAlarm', this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="flex justify-between items-center">
                    <div>
                        <strong class="text-sm flex items-center gap-2"><i data-lucide="map-pin" style="width: 16px; height: 16px;"></i> Auto-Share Live GPS</strong>
                        <p class="text-xs text-muted mt-1">Automatically share on SOS</p>
                    </div>
                    <label class="switch">
                        <input type="checkbox" id="toggleAutoLocation" onchange="updateSetting('autoShareLocation', this.checked)">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="card p-4 mb-4 flex items-center gap-3">
                <div class="action-icon flex items-center justify-center" style="margin:0; width: 32px; height: 32px;">
                    <i data-lucide="globe" style="width: 18px; height: 18px;"></i>
                </div>
                <div>
                    <strong class="text-sm">Language</strong>
                    <p class="text-xs text-muted mt-1">English (US)</p>
                </div>
            </div>

            <div class="card p-4 flex items-center gap-3">
                <div class="action-icon flex items-center justify-center" style="margin:0; width: 32px; height: 32px;">
                    <i data-lucide="info" style="width: 18px; height: 18px;"></i>
                </div>
                <div>
                    <strong class="text-sm">Version</strong>
                    <p class="text-xs text-muted mt-1">SheSafe Full-Stack v1.0.0</p>
                </div>
            </div>
        </div>
    </main>

    <script src="api.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const data = await settingsAPI.get();
                if (data.success && data.settings) {
                    document.getElementById("toggleNotifications").checked = data.settings.notifications;
                    document.getElementById("toggleSoundAlarm").checked = data.settings.soundAlarm;
                    document.getElementById("toggleAutoLocation").checked = data.settings.autoShareLocation;
                }
            } catch (e) { console.log("Using default settings state"); }
        });

        async function updateSetting(key, val) {
            try {
                await settingsAPI.update({ [key]: val });
                showToast("Setting preference updated!", "success");
            } catch (e) { showToast("Failed to save setting: " + e.message, "error"); }
        }
    </script>
    <script>lucide.createIcons();</script>
</body>
</html>
